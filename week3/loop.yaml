# network.yaml: your routed network, as data. A starting point to change into your own design.
#
#   python3 build_routed.py network.yaml      checks it, then builds it in Mininet
#   python3 make_page3.py network.yaml        checks it, then writes docs/week3/index.html
#
# Replace 4941 and every NN (see "Your addresses"). Don't put your full student ID here.
#
# Each LAN has one router (.1 on the LAN) and one host (.10).
# On each link, the first router named is .1 and the second is .2.
# This starting point is the lab's network without r3. It works, but it doesn't meet the
# assignment's requirements: that's your job.

student_id_last4: "4941"

routers: [r1, r2, r3, r4]

lans:
  - name: lan-h1
    network: 10.41.10.0/24
    router: r1
    host: h1
  - name: lan-h2
    network: 10.41.11.0/24
    router: r2
    host: h2
  - name: lan-h3
    network: 10.41.20.0/24
    router: r3
    host: h3
  - name: lan-h4
    network: 10.41.21.0/24
    router: r4
    host: h4

links:
  - [r1, r2, 10.41.12.0/30]   # r1 .1, r2 .2
  - [r2, r3, 10.41.23.0/30]   # r2 .1, r3 .2
  - [r3, r4, 10.41.34.0/30]   # r3 .1, r4 .2
  - [r1, r4, 10.41.14.0/30]   # r1 .1, r4 .2

routes:
  r1:
    - to: 10.41.11.0/24       # h2, direct to r2
      via: 10.41.12.2
    - to: 10.41.20.0/23       # summary: h3 + h4, via r4
      via: 10.41.14.2
    - to: 10.41.23.0/30       # link r2-r3, via r2
      via: 10.41.12.2
    - to: 10.41.34.0/30       # link r3-r4, via r4
      via: 10.41.14.2
  r2:
    - to: 10.41.10.0/24       # h1, direct to r1
      via: 10.41.12.1
    - to: 10.41.20.0/23       # summary: h3 + h4, via r3
      via: 10.41.23.2
    - to: 10.41.14.0/30       # link r1-r4, via r1
      via: 10.41.12.1
    - to: 10.41.34.0/30       # link r3-r4, via r3
      via: 10.41.23.2
  r3:
    - to: 10.41.21.0/24       # h4, direct to r4
      via: 10.41.34.2
    - to: 10.41.10.0/23       # summary: h1 + h2, via r2
      via: 10.41.23.1
    - to: 10.41.12.0/30       # link r1-r2, via r2
      via: 10.41.23.1
    - to: 10.41.14.0/30       # link r1-r4, via r4
      via: 10.41.34.2
  r4:
    - to: 10.41.20.0/24       # h3, direct to r3
      via: 10.41.14.1
    - to: 10.41.10.0/23       # summary: h1 + h2, via r1
      via: 10.41.14.1
    - to: 10.41.12.0/30       # link r1-r2, via r1
      via: 10.41.14.1
    - to: 10.41.23.0/30       # link r2-r3, via r3
      via: 10.41.34.1
